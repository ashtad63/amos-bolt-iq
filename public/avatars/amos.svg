<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Dark navy backdrop (dark-theme compatible) -->
  <circle cx="100" cy="100" r="100" fill="#0f172a"/>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#fafafa" stroke-width="6"/>

  <!-- Dog (golden-retriever-style face), in light strokes/fills on the dark backdrop -->
  <g fill="#fafafa" stroke="#fafafa" stroke-width="1.5" stroke-linejoin="round">
    <!-- Left ear (floppy, fur-textured edge) -->
    <path d="M 55 75
             C 40 80, 35 95, 38 115
             C 40 130, 50 138, 60 138
             C 58 122, 56 100, 60 82
             Z"/>
    <!-- Right ear -->
    <path d="M 145 75
             C 160 80, 165 95, 162 115
             C 160 130, 150 138, 140 138
             C 142 122, 144 100, 140 82
             Z"/>

    <!-- Top of head + fur fringe between ears -->
    <path d="M 60 75
             Q 70 50, 100 50
             Q 130 50, 140 75
             Q 132 70, 125 72
             Q 118 65, 110 70
             Q 100 62, 90 70
             Q 82 65, 75 72
             Q 68 70, 60 75
             Z"/>

    <!-- Face / muzzle region -->
    <path d="M 60 78
             Q 55 110, 70 135
             L 80 135
             L 80 152
             Q 85 158, 95 158
             L 105 158
             Q 115 158, 120 152
             L 120 135
             L 130 135
             Q 145 110, 140 78
             Q 130 90, 115 92
             L 85 92
             Q 70 90, 60 78
             Z"/>
  </g>

  <!-- Cut-outs / negative space: eyes, nose, mouth shown as dark holes through the white fill -->
  <g fill="#0f172a">
    <!-- Eyes -->
    <ellipse cx="80" cy="105" rx="5.5" ry="6.5"/>
    <ellipse cx="120" cy="105" rx="5.5" ry="6.5"/>
  </g>
  <!-- Eye highlights -->
  <circle cx="81.5" cy="103.5" r="1.5" fill="#fafafa"/>
  <circle cx="121.5" cy="103.5" r="1.5" fill="#fafafa"/>

  <!-- Nose -->
  <ellipse cx="100" cy="125" rx="7" ry="5" fill="#0f172a"/>

  <!-- Closed-mouth line under nose -->
  <path d="M 100 132 Q 100 138, 95 142 M 100 132 Q 100 138, 105 142" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Bolt held horizontally in mouth -->
  <g>
    <!-- Hex head (left) -->
    <polygon points="40,145 55,140 70,145 70,160 55,165 40,160" fill="#fafafa" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Hex face bevel highlight -->
    <line x1="55" y1="140" x2="55" y2="165" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Shaft -->
    <rect x="70" y="147" width="90" height="11" fill="#fafafa" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Thread lines -->
    <g stroke="#0f172a" stroke-width="1.2">
      <line x1="76" y1="147" x2="76" y2="158"/>
      <line x1="82" y1="147" x2="82" y2="158"/>
      <line x1="88" y1="147" x2="88" y2="158"/>
      <line x1="94" y1="147" x2="94" y2="158"/>
      <line x1="100" y1="147" x2="100" y2="158"/>
      <line x1="106" y1="147" x2="106" y2="158"/>
      <line x1="112" y1="147" x2="112" y2="158"/>
      <line x1="118" y1="147" x2="118" y2="158"/>
      <line x1="124" y1="147" x2="124" y2="158"/>
      <line x1="130" y1="147" x2="130" y2="158"/>
      <line x1="136" y1="147" x2="136" y2="158"/>
      <line x1="142" y1="147" x2="142" y2="158"/>
      <line x1="148" y1="147" x2="148" y2="158"/>
      <line x1="154" y1="147" x2="154" y2="158"/>
    </g>
    <!-- Tip -->
    <rect x="160" y="149" width="6" height="7" fill="#fafafa" stroke="#0f172a" stroke-width="1.5"/>
  </g>
</svg>
