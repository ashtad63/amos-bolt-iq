<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 224" role="img" aria-label="Predictant logo, dark theme">
  <defs>
    <linearGradient id="grad1-d" x1="56" y1="144" x2="156" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15B5E8"/>
      <stop offset="45%" stop-color="#5E2C90"/>
      <stop offset="100%" stop-color="#15B5E8"/>
    </linearGradient>
    <linearGradient id="grad2-d" x1="96" y1="56" x2="166" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15B5E8"/>
      <stop offset="100%" stop-color="#5E2C90"/>
    </linearGradient>
    <linearGradient id="textGrad-d" x1="240" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e8e8f5"/>
      <stop offset="100%" stop-color="#d4d4e8"/>
    </linearGradient>
  </defs>

  <!-- Mark: user's interlocking D/P SVG, native 224x224 coords -->
  <g>
    <path d="M 56 88 H 104 V 152 H 56 Z"
          fill="none" stroke="url(#grad1-d)" stroke-width="10"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M 104 56 V 120 M 104 56 H 136 A 24 24 0 0 1 136 104 H 104"
          fill="none" stroke="url(#grad2-d)" stroke-width="10"
          stroke-linecap="square" stroke-linejoin="round"/>
  </g>

  <!-- "Predictant" wordmark next to the mark -->
  <text x="200" y="150" font-family="Georgia, 'Times New Roman', serif"
        font-size="120" font-weight="700" letter-spacing="-2"
        fill="url(#textGrad-d)">Predictant</text>
</svg>
