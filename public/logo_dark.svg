<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600">
  <defs>
    <linearGradient id="purpleGrad-d" gradientUnits="userSpaceOnUse" x1="600" y1="50" x2="0" y2="450">
      <stop offset="0%" stop-color="#80198C"/>
      <stop offset="35%" stop-color="#4B1675"/>
      <stop offset="70%" stop-color="#221A69"/>
      <stop offset="100%" stop-color="#163A8A"/>
    </linearGradient>
    <linearGradient id="cyanGrad-d" gradientUnits="userSpaceOnUse" x1="0" y1="550" x2="450" y2="0">
      <stop offset="0%" stop-color="#194B9C"/>
      <stop offset="25%" stop-color="#00AEEF"/>
      <stop offset="75%" stop-color="#00AEEF"/>
      <stop offset="100%" stop-color="#3D309B"/>
    </linearGradient>
  </defs>

  <!-- Predictant P mark (the user's exact SVG, scaled to 600x550 area) -->
  <g transform="translate(20,25) scale(0.55)">
    <path d="M 800,0
             A 300,300 0 0,1 800,600
             L 200,600
             L 200,800
             L 0,800
             L 0,400
             L 800,400
             A 100,100 0 0,0 800,200
             Z"
          fill="url(#purpleGrad-d)"/>
    <polygon points="0,800
                     0,1000
                     600,1000
                     600,0
                     800,0
                     800,200
                     400,200
                     400,800"
             fill="url(#cyanGrad-d)"/>
  </g>

  <!-- Predictant wordmark to the right of the P mark -->
  <text x="640" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="290" font-weight="700" fill="#fafafa" letter-spacing="-2">Predictant</text>
</svg>
